name: DNS diagnose (temporary)
on:
  push:
    branches: [arena/24763190-my-new-site]
    paths: [.github/workflows/dns-diagnose.yml]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
      - run: |
          note() { local t="$1"; local m; m=$(cat | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=$t::${m:-<empty>}"; }
          { P=$(dig +short NS co.za | head -1); echo "registry: $(dig +norec NS lulazel.co.za @$P | grep -oE 'status: [A-Z]+')"
            for r in 8.8.8.8 1.1.1.1 9.9.9.9 208.67.222.222; do echo "$r apex: $(dig +short A lulazel.co.za @$r | tr '\n' ' ') | www: $(dig +short www.lulazel.co.za @$r | tr '\n' ' ')"; done; } | note public
          { for u in http://lulazel.co.za http://www.lulazel.co.za https://www.lulazel.co.za https://lulazel.co.za; do echo "$u -> $(curl -s -o /dev/null --max-time 12 -w '%{http_code} %{redirect_url} ssl=%{ssl_verify_result}' $u 2>&1)"; done
            echo; echo | openssl s_client -connect www.lulazel.co.za:443 -servername www.lulazel.co.za 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName 2>&1 | head -6; } | note http
