name: DNS diagnose (temporary)
on:
  push:
    branches: [arena/24763190-my-new-site]
    paths: [.github/workflows/dns-diagnose.yml]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
      - run: |
          note() { local t="$1"; local m; m=$(cat | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=$t::${m:-<empty>}"; }
          { for P in $(dig +short NS co.za); do echo "$P: $(dig +norec +time=4 NS lulazel.co.za @$P | grep -oE 'status: [A-Z]+') $(dig +norec +time=4 NS lulazel.co.za @$P | awk '/IN\s+NS/{print $5}' | sort -u | tr '\n' ' ')"; done; echo "co.za SOA: $(dig +short SOA co.za)"; } | note delegation
