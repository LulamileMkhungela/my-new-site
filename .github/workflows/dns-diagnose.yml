name: DNS diagnose (temporary)
on:
  push:
    branches: [arena/24763190-my-new-site]
    paths: [.github/workflows/dns-diagnose.yml]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils whois >/dev/null 2>&1 || true
      - run: |
          note() { local t="$1"; shift; local m; m=$(cat | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=$t::${m:-<empty>}"; }
          { for q in "NS lulazel.co.za" "SOA lulazel.co.za" "A lulazel.co.za" "AAAA lulazel.co.za" "CNAME www.lulazel.co.za" "A www.lulazel.co.za" "MX lulazel.co.za"; do
              set -- $q; echo "[$1 $2] google: $(dig +short $1 $2 @8.8.8.8 | tr '\n' ' ') | cloudflare: $(dig +short $1 $2 @1.1.1.1 | tr '\n' ' ')"; done; } | note records
          P=$(dig +short NS co.za | head -1)
          dig +norec NS lulazel.co.za @$P | grep -E 'status|IN\s+NS|IN\s+A' | note delegation
          for ns in $(dig +norec NS lulazel.co.za @$P | awk '/IN\s+NS/{print $5}' | sort -u); do
            { echo "ns=$ns"; dig +short A $ns; echo "www:"; dig +norec www.lulazel.co.za @$ns | grep -E 'status|IN\s'; echo "apex:"; dig +norec A lulazel.co.za @$ns | grep -E 'status|IN\s'; } | note "auth-$ns"
          done
          whois -h whois.registry.net.za lulazel.co.za 2>&1 | grep -vE '^\s*$|^%' | head -40 | note whois
