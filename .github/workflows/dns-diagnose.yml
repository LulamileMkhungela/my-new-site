name: DNS diagnose (temporary)
on:
  push:
    branches: [arena/24763190-my-new-site]
    paths: [.github/workflows/dns-diagnose.yml]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils whois >/dev/null 2>&1 || true
      - run: |
          note() { local t="$1"; local m; m=$(cat | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=$t::${m:-<empty>}"; }
          for ns in ns1.named.co.za ns2.named.co.za directadmin.resolving.co.za; do
            { for q in "A lulazel.co.za" "CNAME www.lulazel.co.za" "A www.lulazel.co.za"; do set -- $q
                echo "[$1 $2] $(dig +norec +time=4 +tries=2 $1 $2 @$ns | grep -oE 'status: [A-Z]+' ) -> $(dig +norec +short +time=4 +tries=2 $1 $2 @$ns | tr '\n' ' ')"; done; } | note "$ns"
          done
          whois -h whois.registry.net.za lulazel.co.za 2>&1 | grep -iE "^Domain Status|^Updated" | note whois
          { echo "google A: $(dig +short A lulazel.co.za @8.8.8.8 | tr '\n' ' ')"; echo "google www: $(dig +short www.lulazel.co.za @8.8.8.8 | tr '\n' ' ')"; } | note public
