name: DNS diagnose (temporary)
on:
  push:
    branches: [arena/24763190-my-new-site]
    paths: [.github/workflows/dns-diagnose.yml]
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
      - run: |
          note() { local t="$1"; local m; m=$(cat | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::notice title=$t::${m:-<empty>}"; }
          for ns in ns1.named.co.za ns2.named.co.za directadmin.resolving.co.za; do
            { echo "ns ip: $(dig +short A $ns | tr '\n' ' ')"
              for q in "A lulazel.co.za" "A www.lulazel.co.za" "CNAME www.lulazel.co.za" "NS lulazel.co.za"; do set -- $q
                echo "[$1 $2] $(dig +norec +time=3 +tries=1 $1 $2 @$ns | grep -oE 'status: [A-Z]+' ) -> $(dig +norec +short +time=3 +tries=1 $1 $2 @$ns | tr '\n' ' ')"; done; } | note "$ns"
          done
