<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" fill="none"><title>Good conversations connect both sides</title><desc>Two physical conversation shapes are bridged by a warm coral telephone receiver: a direct and human invitation to talk. Original conceptual vector artwork. Every object is an editable SVG path or shape; not a product screenshot.</desc><defs>
