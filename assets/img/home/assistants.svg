<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" fill="none"><title>Useful answers, grounded in your knowledge</title><desc>Two generous conversation forms rise from an open knowledge book. A check mark connects an answer to a shared source, without robot branding. Original conceptual vector artwork. Every object is an editable SVG path or shape; not a product screenshot.</desc><defs>
