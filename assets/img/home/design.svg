<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" fill="none"><title>An idea with a recognisable signature</title><desc>A bold Bezier curve is shaped with visible control handles, supported by a rich colour fan, dimensional pencil and a focused audience target. Original conceptual vector artwork. Every object is an editable SVG path or shape; not a product screenshot.</desc><defs>
<linearGradient id="emerald" x2=".8" y2="1"><stop stop-color="#6af2bc"/><stop offset=".35" stop-color="#18cd8a"/><stop offset="1" stop-color="#00734f"/></linearGradient>
