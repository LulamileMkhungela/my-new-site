<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" fill="none"><title>From a spark to something useful</title><desc>An oversized sculptural cursor lifts an idea sphere as a drawn line becomes a built ribbon and a paper plane takes flight. Original conceptual vector artwork. Every object is an editable SVG path or shape; not a product screenshot.</desc><defs>
